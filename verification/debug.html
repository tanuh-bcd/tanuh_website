.consent-container {

.consent-header {
  background-color: #f8f7fa;

    <div id="root"><div class="app-container"><div class="progress-bar-container"><div class="progress-bar-label">Progress: 9%</div><div class="progress-bar-track"><div class="progress-bar-fill" style="width: 9%;"></div></div></div><form class="questionnaire-container" novalidate=""><img alt="TANUH Logo" class="logo tanuh-logo" src="/tanuh.png"><img alt="IISC Logo" class="logo iisc-logo" src="/IISc_logo.png"><div class="form-header"><h1>Breast Cancer Risk Questionnaire</h1><p style="color: rgb(83, 59, 66); font-size: 18px; margin-top: 8px;">Please answer the following questions to the best of your ability.</p><p style="color: rgb(83, 59, 66); font-size: 15px; margin-top: 8px;">Fields marked with <span style="color: rgb(217, 48, 37); font-weight: 600;">*</span> are mandatory.</p></div><div class="form-section"><h2>Section 1: General Information</h2> <div class="question-block "><label>1. Enter your Patient ID(if any, else leave):</label><input placeholder="DBzPVfCt" class="text-input" type="text" value="DBzPVfCt" name="Q44" style=""></div><div class="question-block "><label>2. Enter the Hospital ID(If any, else leave):</label><input placeholder="Universal" class="text-input" type="text" value="Universal" name="Q45" style=""></div><div class="question-block "><label>3. What is your Gender?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Female" name="Q47" style=""> Female</label><label><input type="radio" value="Male" name="Q47" style=""> Male</label><label><input type="radio" value="Other" name="Q47" style=""> Other</label></div></div><div class="question-block "><label>4. What is your current age? (Please enter a number - years)<span class="required-asterisk">*</span></label><input placeholder="e.g., 35" class="text-input" min="18" max="120" step="1" type="number" value="" name="Q1" style=""></div><div class="question-block "><label>5. What is your current height in cms?<span class="required-asterisk">*</span></label><input placeholder="e.g., 165" class="text-input" min="100" max="300" step="1" type="number" value="" name="Q2" style=""></div><div class="question-block "><label>6. What is your current Weight in kgs?<span class="required-asterisk">*</span></label><input placeholder="e.g., 60" class="text-input" min="30" max="500" step="0.1" type="number" value="" name="Q3" style=""></div><div class="question-block "><label>7. Which state or union territory best represents the place where you have lived for a significant part of your life?<span class="required-asterisk">*</span></label><select name="Q4" class="select-input"><option value="" disabled="">Select an option</option><option value="Andhra Pradesh">Andhra Pradesh</option><option value="Arunachal Pradesh">Arunachal Pradesh</option><option value="Assam">Assam</option><option value="Bihar">Bihar</option><option value="Chhattisgarh">Chhattisgarh</option><option value="Goa">Goa</option><option value="Gujarat">Gujarat</option><option value="Haryana">Haryana</option><option value="Himachal Pradesh">Himachal Pradesh</option><option value="Jharkhand">Jharkhand</option><option value="Karnataka">Karnataka</option><option value="Kerala">Kerala</option><option value="Madhya Pradesh">Madhya Pradesh</option><option value="Maharashtra">Maharashtra</option><option value="Manipur">Manipur</option><option value="Meghalaya">Meghalaya</option><option value="Mizoram">Mizoram</option><option value="Nagaland">Nagaland</option><option value="Odisha">Odisha</option><option value="Punjab">Punjab</option><option value="Rajasthan">Rajasthan</option><option value="Sikkim">Sikkim</option><option value="Tamil Nadu">Tamil Nadu</option><option value="Telangana">Telangana</option><option value="Tripura">Tripura</option><option value="Uttar Pradesh">Uttar Pradesh</option><option value="Uttarakhand">Uttarakhand</option><option value="West Bengal">West Bengal</option><option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option><option value="Chandigarh">Chandigarh</option><option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option><option value="Delhi">Delhi</option><option value="Jammu and Kashmir">Jammu and Kashmir</option><option value="Ladakh">Ladakh</option><option value="Lakshadweep">Lakshadweep</option><option value="Puducherry">Puducherry</option></select></div><div class="question-block "><label>8. What is your approximate annual household income?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Less than ₹2,00,000 per annum" name="Q5" style=""> Less than ₹2,00,000 per annum</label><label><input type="radio" value="Between ₹2,00,000 and ₹5,00,000 per annum" name="Q5" style=""> Between ₹2,00,000 and ₹5,00,000 per annum</label><label><input type="radio" value="Between ₹5,00,000 and ₹10,00,000 per annum" name="Q5" style=""> Between ₹5,00,000 and ₹10,00,000 per annum</label><label><input type="radio" value="Greater than ₹10,00,000 per annum" name="Q5" style=""> Greater than ₹10,00,000 per annum</label></div></div><div class="question-block "><label>9. What is the highest level of education you have completed?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="No formal education" name="Q6" style=""> No formal education</label><label><input type="radio" value="Up to Class 9(Primary/Middle)" name="Q6" style=""> Up to Class 9(Primary/Middle)</label><label><input type="radio" value="Class 10 or 12(Secondary/Higher Secondary)" name="Q6" style=""> Class 10 or 12(Secondary/Higher Secondary)</label><label><input type="radio" value="Graduation &amp; Above" name="Q6" style=""> Graduation &amp; Above</label></div></div><div class="question-block "><label>10. Have you been diagnosed with diabetes?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q7" style=""> Yes</label><label><input type="radio" value="No" name="Q7" style=""> No</label><label><input type="radio" value="I don't know" name="Q7" style=""> I don't know</label></div></div><div class="question-block "><label>11. Have you been diagnosed with high blood pressure (hypertension)?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q8" style=""> Yes</label><label><input type="radio" value="No" name="Q8" style=""> No</label><label><input type="radio" value="I don't know" name="Q8" style=""> I don't know</label></div></div><div class="question-block "><label>12. Have you had a menstrual period?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q9" style=""> Yes</label><label><input type="radio" value="No" name="Q9" style=""> No</label><label><input type="radio" value="I don't know" name="Q9" style=""> I don't know</label></div></div><div class="question-block "><label>13. What is your Marital Status?</label><div class="radio-group vertical"><label><input type="radio" value="Married" name="Q13" style=""> Married</label><label><input type="radio" value="Never Married" name="Q13" style=""> Never Married</label></div></div><div class="question-block "><label>14. Have you given birth to one or more children?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q14" style=""> Yes</label><label><input type="radio" value="No" name="Q14" style=""> No</label></div></div><div class="question-block "><label>15. Have you smoked cigarettes, bidis, or used any other form of tobacco (e.g., chewing tobacco)?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q18" style=""> Yes</label><label><input type="radio" value="No" name="Q18" style=""> No</label><label><input type="radio" value="I do not wish to answer" name="Q18" style=""> I do not wish to answer</label></div></div><div class="question-block "><label>16. Do you consume alcohol?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q19" style=""> Yes</label><label><input type="radio" value="No" name="Q19" style=""> No</label><label><input type="radio" value="I do not wish to answer" name="Q19" style=""> I do not wish to answer</label></div></div><div class="question-block "><label>17. Have any relatives been diagnosed with any type of cancer?</label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q20" style=""> Yes</label><label><input type="radio" value="No" name="Q20" style=""> No</label><label><input type="radio" value="I don't know" name="Q20" style=""> I don't know</label></div></div></div><div class="form-section"><h2>Section 2: Breast Examination (BE)</h2> <div class="question-block "><label>18. Have you ever undergone a Breast Examination (BE)?</label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q27" style=""> Yes</label><label><input type="radio" value="No" name="Q27" style=""> No</label></div></div><div class="question-block "><label>19. During BE, was any lump or mass detected in your breast?</label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q30" style=""> Yes</label><label><input type="radio" value="No" name="Q30" style=""> No</label></div></div><div class="question-block "><label>20. Did you experience breast pain or tenderness during examination?</label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q34" style=""> Yes</label><label><input type="radio" value="No" name="Q34" style=""> No</label></div></div></div><div class="form-section"><h2>Section 3: Beyond BE</h2> <div class="question-block "><label>21. Have you undergone a mammogram?</label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q38" style=""> Yes</label><label><input type="radio" value="No" name="Q38" style=""> No</label></div></div><div class="question-block "><label>22. Have you had a breast biopsy?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q40" style=""> Yes</label><label><input type="radio" value="No" name="Q40" style=""> No</label></div></div><div class="question-block "><label>23. Have you ever been diagnosed with any type of cancer?<span class="required-asterisk">*</span></label><div class="radio-group vertical"><label><input type="radio" value="Yes" name="Q42" style=""> Yes</label><label><input type="radio" value="No" name="Q42" style=""> No</label></div></div></div><div class="submit-button-container"><button type="submit" class="submit-button">Submit Questionnaire</button></div></form></div></div>
